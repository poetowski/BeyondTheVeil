<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#4a4460"/>
      <stop offset="100%" stop-color="#2c273c"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="512" height="512" fill="url(#backdrop)"/>

  <!-- shoulders / cloak -->
  <path d="M120,470 Q112,330 256,300 Q400,330 392,470 Z"
        fill="#5b5470" stroke="#3a352f" stroke-width="6" stroke-linejoin="round"/>
  <!-- cloak shading -->
  <path d="M256,300 Q340,320 372,440 L256,460 Z" fill="#463f5c" opacity="0.8"/>

  <!-- neck -->
  <rect x="228" y="266" width="56" height="46" fill="#c79e78" stroke="#3a352f" stroke-width="4"/>

  <!-- head -->
  <ellipse cx="256" cy="210" rx="72" ry="80" fill="#d9ad81" stroke="#3a352f" stroke-width="6"/>
  <!-- head shading -->
  <path d="M300,150 Q328,210 306,270 Q322,200 296,156 Z" fill="#c79e78" opacity="0.7"/>

  <!-- hood -->
  <path d="M172,196 Q160,90 256,70 Q352,90 340,196 Q330,120 256,110 Q182,120 172,196 Z"
        fill="#4a4460" stroke="#3a352f" stroke-width="6" stroke-linejoin="round"/>

  <!-- eyes -->
  <ellipse cx="228" cy="212" rx="9" ry="7" fill="#2b2823"/>
  <ellipse cx="284" cy="212" rx="9" ry="7" fill="#2b2823"/>

  <!-- neutral brow line -->
  <path d="M212,192 Q228,184 244,192" fill="none" stroke="#3a352f" stroke-width="4" stroke-linecap="round"/>
  <path d="M268,192 Q284,184 300,192" fill="none" stroke="#3a352f" stroke-width="4" stroke-linecap="round"/>

  <!-- mouth -->
  <path d="M234,252 Q256,262 278,252" fill="none" stroke="#3a352f" stroke-width="4" stroke-linecap="round"/>
</svg>
