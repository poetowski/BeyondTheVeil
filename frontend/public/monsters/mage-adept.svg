<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2df"/>
      <stop offset="1" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant tree line, irregular spacing and heights -->
  <g fill="#7c8f61">
    <polygon points="20,340 38,300 58,340"/>
    <polygon points="92,340 112,286 140,340"/>
    <polygon points="305,340 326,312 348,340"/>
    <polygon points="392,340 418,296 448,340"/>
    <polygon points="458,340 474,320 490,340"/>
  </g>

  <!-- foreground tree, left - big and close -->
  <g>
    <rect x="14" y="288" width="18" height="94" fill="#5b4636"/>
    <polygon points="-18,288 66,288 23,228" fill="#4f6b47"/>
    <polygon points="-10,250 58,250 23,196" fill="#4f6b47"/>
    <polygon points="-2,214 50,214 23,166" fill="#4f6b47"/>
  </g>
  <!-- foreground tree, right - smaller, set further back -->
  <g>
    <rect x="462" y="322" width="10" height="54" fill="#5b4636"/>
    <polygon points="442,322 500,322 467,288" fill="#4f6b47"/>
    <polygon points="446,300 496,300 467,270" fill="#4f6b47"/>
    <polygon points="450,278 492,278 467,252" fill="#4f6b47"/>
  </g>

  <!-- ground shadow, offset toward the planted foot -->
  <ellipse cx="246" cy="430" rx="96" ry="16" fill="#7c8a5a" opacity="0.6" transform="rotate(-4 246 430)"/>

  <!-- robe, symmetrical -->
  <polygon points="256,232 214,248 182,300 152,438 360,438 330,300 298,248"
           fill="#4a3a63" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- centered fold shading, symmetric -->
  <rect x="246" y="248" width="20" height="184" fill="#382a4d" opacity="0.5"/>
  <!-- hem trim, symmetric -->
  <rect x="152" y="426" width="208" height="12" fill="#c9a227" opacity="0.85"/>
  <!-- collar, symmetric -->
  <path d="M222,250 Q256,268 290,250 L290,238 Q256,254 222,238 Z" fill="#382a4d"/>

  <!-- left sleeve, raised high, bent at the elbow -->
  <path d="M214,250 Q166,224 156,182 Q150,158 138,140 L158,132 Q168,156 176,182 Q190,214 234,244 Z"
        fill="#4a3a63" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- right sleeve, raised lower and out to the side -->
  <path d="M294,246 Q342,228 360,206 Q370,196 380,186 L394,200 Q380,212 368,224 Q346,246 308,258 Z"
        fill="#4a3a63" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>

  <!-- hands, uneven heights -->
  <ellipse cx="146" cy="128" rx="13" ry="11" fill="#c99a6c" stroke="#3a352f" stroke-width="4"/>
  <ellipse cx="386" cy="192" rx="13" ry="11" fill="#c99a6c" stroke="#3a352f" stroke-width="4"/>

  <!-- neck, centered -->
  <rect x="241" y="220" width="30" height="24" fill="#c99a6c"/>

  <!-- bald head, centered and level -->
  <circle cx="256" cy="188" r="44" fill="#c99a6c" stroke="#3a352f" stroke-width="5"/>
  <!-- symmetric top shine -->
  <ellipse cx="256" cy="150" rx="16" ry="8" fill="#e2bd93" opacity="0.8"/>
  <!-- symmetric jaw shading -->
  <ellipse cx="256" cy="222" rx="30" ry="10" fill="#b3825a" opacity="0.5"/>
  <!-- ears, symmetric -->
  <ellipse cx="212" cy="190" rx="8" ry="12" fill="#c99a6c" stroke="#3a352f" stroke-width="3"/>
  <ellipse cx="300" cy="190" rx="8" ry="12" fill="#c99a6c" stroke="#3a352f" stroke-width="3"/>

  <!-- angry eyebrows, symmetric V -->
  <path d="M242,168 L216,156" fill="none" stroke="#3a352f" stroke-width="6" stroke-linecap="round"/>
  <path d="M270,168 L296,156" fill="none" stroke="#3a352f" stroke-width="6" stroke-linecap="round"/>
  <!-- furrow crease, centered -->
  <path d="M256,164 L256,174" fill="none" stroke="#3a352f" stroke-width="3" stroke-linecap="round"/>

  <!-- narrowed angry eyes, symmetric -->
  <ellipse cx="234" cy="186" rx="7" ry="3.5" fill="#2b2823" transform="rotate(14 234 186)"/>
  <ellipse cx="278" cy="186" rx="7" ry="3.5" fill="#2b2823" transform="rotate(-14 278 186)"/>

  <!-- frown, symmetric -->
  <path d="M228,212 Q256,204 284,212" fill="none" stroke="#3a352f" stroke-width="3" stroke-linecap="round"/>

  <!-- fireball, off-center above the higher hand -->
  <circle cx="204" cy="104" r="52" fill="#ffab5e" opacity="0.3"/>
  <circle cx="204" cy="104" r="34" fill="#e8622c" stroke="#3a352f" stroke-width="4"/>
  <circle cx="204" cy="104" r="18" fill="#ffe27a"/>
  <!-- flame flicks, asymmetric -->
  <path d="M196,70 Q200,50 184,38 Q198,54 186,68 Z" fill="#ffab5e"/>
  <path d="M174,84 Q154,76 156,56 Q170,72 180,82 Z" fill="#ffab5e" opacity="0.85"/>
  <path d="M236,90 Q258,86 262,64 Q244,76 228,86 Z" fill="#ffab5e" opacity="0.7"/>
  <ellipse cx="194" cy="94" rx="7" ry="4" fill="#fff6db" opacity="0.9"/>
</svg>
