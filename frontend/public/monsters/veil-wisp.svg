<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a42"/>
      <stop offset="100%" stop-color="#3a5fae"/>
    </linearGradient>
  </defs>

  <!-- mystic sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- mystic floor -->
  <rect x="0" y="340" width="512" height="172" fill="#241f4a"/>

  <!-- magic-boom starburst, radiating from the wisp -->
  <g opacity="0.85">
    <polygon points="256,284 256,256 476,270" fill="#8fd3ff" opacity="0.28"/>
    <polygon points="242,270 270,270 256,490" fill="#8fd3ff" opacity="0.28"/>
    <polygon points="256,256 256,284 36,270" fill="#8fd3ff" opacity="0.28"/>
    <polygon points="270,270 242,270 256,50" fill="#8fd3ff" opacity="0.28"/>
    <polygon points="246,280 266,260 412,426" fill="#cdb8f5" opacity="0.24"/>
    <polygon points="246,260 266,280 100,426" fill="#cdb8f5" opacity="0.24"/>
    <polygon points="266,260 246,280 100,114" fill="#cdb8f5" opacity="0.24"/>
    <polygon points="266,280 246,260 412,114" fill="#cdb8f5" opacity="0.24"/>
  </g>

  <!-- sparkle stars -->
  <g fill="#eaffff">
    <circle cx="70" cy="60" r="2.5" opacity="0.85"/>
    <circle cx="120" cy="130" r="1.8" opacity="0.6"/>
    <circle cx="60" cy="200" r="2" opacity="0.7"/>
    <circle cx="160" cy="70" r="1.6" opacity="0.55"/>
    <circle cx="440" cy="80" r="2.4" opacity="0.8"/>
    <circle cx="400" cy="150" r="1.8" opacity="0.6"/>
    <circle cx="460" cy="210" r="2.2" opacity="0.75"/>
    <circle cx="360" cy="55" r="1.6" opacity="0.5"/>
    <circle cx="256" cy="40" r="2" opacity="0.7"/>
    <circle cx="200" cy="120" r="1.5" opacity="0.5"/>
    <circle cx="310" cy="110" r="1.7" opacity="0.55"/>
    <circle cx="90" cy="290" r="1.8" opacity="0.5"/>
    <circle cx="430" cy="290" r="1.8" opacity="0.5"/>
  </g>

  <!-- crystal shards (left) -->
  <g>
    <polygon points="10,390 4,270 16,390" fill="#7fb8e8" stroke="#3a352f" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="27,390 20,308 36,390" fill="#a3c9ee" stroke="#3a352f" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="42,390 36,332 50,390" fill="#8fd3ff" stroke="#3a352f" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- crystal shards (right) -->
  <g>
    <polygon points="502,390 508,270 496,390" fill="#7fb8e8" stroke="#3a352f" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="485,390 492,308 476,390" fill="#a3c9ee" stroke="#3a352f" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="470,390 476,332 462,390" fill="#8fd3ff" stroke="#3a352f" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- summoning-circle glow on the ground beneath the wisp -->
  <ellipse cx="256" cy="428" rx="82" ry="14" fill="#8fd3ff" opacity="0.18"/>
  <ellipse cx="256" cy="428" rx="70" ry="12" fill="none" stroke="#cdb8f5" stroke-width="2" opacity="0.4"/>

  <!-- trailing wisps, dissipating below the main body -->
  <path d="M232,330 Q206,368 224,404 Q214,372 240,344 Z" fill="#6b4fa0" opacity="0.5"/>
  <path d="M256,340 Q256,388 256,418 Q244,384 256,352 Z" fill="#6b4fa0" opacity="0.4"/>
  <path d="M282,330 Q310,364 292,400 Q302,368 274,344 Z" fill="#6b4fa0" opacity="0.5"/>

  <!-- outer glow -->
  <ellipse cx="256" cy="270" rx="118" ry="112" fill="#d7c9f0" opacity="0.3"/>
  <!-- mid glow -->
  <ellipse cx="256" cy="270" rx="88" ry="84" fill="#b9a0e3" opacity="0.5"/>

  <!-- body: a flickering knot of veil-light -->
  <path d="M256,172
           Q310,182 322,238
           Q334,282 300,320
           Q270,352 256,352
           Q242,352 212,320
           Q178,282 190,238
           Q202,182 256,172 Z"
        fill="#8f6fc4" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>

  <!-- shading patch -->
  <ellipse cx="288" cy="268" rx="42" ry="54" fill="#6b4fa0" opacity="0.85"/>

  <!-- inner light core -->
  <ellipse cx="248" cy="256" rx="46" ry="50" fill="#f3ecff"/>

  <!-- eyes: pale glowing points, not a face so much as light gathering -->
  <circle cx="234" cy="252" r="11" fill="#eaffff" stroke="#3a352f" stroke-width="2"/>
  <circle cx="270" cy="252" r="11" fill="#eaffff" stroke="#3a352f" stroke-width="2"/>
  <circle cx="234" cy="255" r="5" fill="#2b2823"/>
  <circle cx="270" cy="255" r="5" fill="#2b2823"/>
  <circle cx="231" cy="249" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="267" cy="249" r="2" fill="#ffffff" opacity="0.9"/>

  <!-- small drifting motes around it -->
  <circle cx="170" cy="230" r="5" fill="#d7c9f0" opacity="0.8"/>
  <circle cx="348" cy="250" r="4" fill="#d7c9f0" opacity="0.7"/>
  <circle cx="330" cy="196" r="3.5" fill="#d7c9f0" opacity="0.7"/>
</svg>
