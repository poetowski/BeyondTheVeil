<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e3b0"/>
      <stop offset="100%" stop-color="#f0c088"/>
    </linearGradient>
  </defs>

  <!-- autumn sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- leaf-litter ground -->
  <rect x="0" y="340" width="512" height="172" fill="#9c7a4a"/>

  <!-- two big autumn trees, framing the scene -->
  <g>
    <rect x="2" y="216" width="24" height="180" fill="#5b4636"/>
    <polygon points="14,90 -46,178 74,178" fill="#a8452b"/>
    <polygon points="14,138 -58,224 86,224" fill="#c97a3a"/>
    <polygon points="14,188 -74,282 102,282" fill="#d9a441"/>
  </g>
  <g>
    <rect x="486" y="196" width="24" height="200" fill="#5b4636"/>
    <polygon points="498,66 438,158 558,158" fill="#d9a441"/>
    <polygon points="498,116 426,206 570,206" fill="#a8452b"/>
    <polygon points="498,168 410,268 586,268" fill="#c97a3a"/>
  </g>

  <!-- scattered fallen leaves -->
  <g>
    <polygon points="90,398 98,388 108,394 102,406" fill="#a8452b" opacity="0.85"/>
    <polygon points="400,410 408,400 418,406 412,418" fill="#d9a441" opacity="0.85"/>
    <polygon points="150,430 158,422 166,428 160,438" fill="#c97a3a" opacity="0.8"/>
  </g>

  <!-- ground shadow beneath the robber -->
  <ellipse cx="200" cy="430" rx="86" ry="15" fill="#7f6138" opacity="0.5"/>

  <!-- back leg -->
  <rect x="212" y="368" width="24" height="64" rx="8" fill="#383b3a" stroke="#3a352f" stroke-width="4"/>
  <ellipse cx="224" cy="432" rx="15" ry="7" fill="#2b2823"/>

  <!-- cloak, tapered and draped -->
  <path d="M150,270 Q152,240 200,224 Q248,240 250,270
           L262,406 Q256,424 200,424 Q144,424 138,406 Z"
        fill="#4f5352" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- cloak shading fold -->
  <path d="M200,244 Q214,300 210,406 L188,406 Q184,300 190,244 Z" fill="#383b3a" opacity="0.85"/>

  <!-- front leg -->
  <rect x="176" y="374" width="24" height="60" rx="8" fill="#454846" stroke="#3a352f" stroke-width="4"/>
  <ellipse cx="188" cy="434" rx="15" ry="7" fill="#2b2823"/>

  <!-- rear arm, hidden mostly under cloak -->
  <rect x="234" y="288" width="20" height="70" rx="9" fill="#454846" stroke="#3a352f" stroke-width="4"/>

  <!-- dagger arm, held low in a bent guard - a single tapered curve from shoulder to fist -->
  <path d="M158,272 Q120,270 115,300 Q126,290 148,278 Z"
        fill="#4f5352" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
  <!-- fist -->
  <circle cx="115" cy="300" r="14" fill="#454846" stroke="#3a352f" stroke-width="3"/>
  <!-- dagger: grip inside the fist, crossguard above it, thin blade angled forward -->
  <g transform="rotate(-45 115 300)">
    <rect x="109" y="284" width="12" height="24" rx="4" fill="#5b4636" stroke="#3a352f" stroke-width="3"/>
    <rect x="99" y="278" width="32" height="6" rx="2" fill="#4a3f35" stroke="#3a352f" stroke-width="3"/>
    <polygon points="115,210 121,278 109,278" fill="#cfd2d4" stroke="#3a352f" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="115,210 117,278 115,278" fill="#eef1f2" opacity="0.85"/>
  </g>

  <!-- hood -->
  <path d="M200,150 Q160,158 156,206 Q158,238 200,246 Q242,238 244,206 Q240,158 200,150 Z"
        fill="#4f5352" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- hood shading -->
  <path d="M200,158 Q222,168 226,206 Q224,228 208,238 Q220,206 200,158 Z" fill="#383b3a" opacity="0.8"/>

  <!-- face shadow, hood conceals everything but the eyes -->
  <ellipse cx="200" cy="206" rx="34" ry="30" fill="#2b2823"/>

  <!-- eyes: pale glints in the shadow -->
  <ellipse cx="188" cy="206" rx="7" ry="5" fill="#d99a3d"/>
  <ellipse cx="212" cy="206" rx="7" ry="5" fill="#d99a3d"/>
  <circle cx="188" cy="206" r="2.2" fill="#2b2823"/>
  <circle cx="212" cy="206" r="2.2" fill="#2b2823"/>
</svg>
