<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- daytime sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- roadside meadow -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant tree line -->
  <g fill="#7c8f61">
    <polygon points="46,345 18,304 74,304"/>
    <polygon points="120,345 92,300 148,300"/>
    <polygon points="376,345 348,302 404,302"/>
    <polygon points="452,345 424,304 480,304"/>
  </g>

  <!-- grass tufts and a scattering of wildflowers along the road -->
  <g fill="#4f6b47">
    <polygon points="24,392 8,350 40,350"/>
    <polygon points="490,388 474,346 506,346"/>
  </g>
  <g fill="#7c8f61">
    <polygon points="64,346 54,322 74,322"/>
    <polygon points="446,342 436,320 456,320"/>
  </g>
  <g>
    <circle cx="86" cy="366" r="4" fill="#f3ecff"/>
    <circle cx="86" cy="366" r="1.6" fill="#e8b23d"/>
    <circle cx="440" cy="372" r="4" fill="#f3ecff"/>
    <circle cx="440" cy="372" r="1.6" fill="#e8b23d"/>
  </g>

  <!-- ground shadow beneath the robber -->
  <ellipse cx="200" cy="430" rx="86" ry="15" fill="#7c8a5a" opacity="0.5"/>

  <!-- back leg -->
  <rect x="212" y="368" width="24" height="64" rx="8" fill="#383b3a" stroke="#3a352f" stroke-width="4"/>
  <ellipse cx="224" cy="432" rx="15" ry="7" fill="#2b2823"/>

  <!-- bow, slung across the back like a hunter - one continuous arc
       peeking above both shoulders, so it reads as a single recognizable
       bow silhouette rather than two separate curves -->
  <path d="M160,226 Q150,150 207,104 Q264,150 254,226"
        fill="none" stroke="#5b4636" stroke-width="9" stroke-linecap="round"/>
  <!-- taut string, straight between the two tips -->
  <line x1="160" y1="226" x2="254" y2="226" stroke="#eee6d5" stroke-width="2.5" opacity="0.85"/>
  <!-- strap crossing the chest, tucked under the cloak collar -->
  <path d="M172,150 L246,250" stroke="#3a2a1c" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- cloak, tapered and draped -->
  <path d="M150,270 Q152,240 200,224 Q248,240 250,270
           L262,406 Q256,424 200,424 Q144,424 138,406 Z"
        fill="#4f5352" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- cloak shading fold -->
  <path d="M200,244 Q214,300 210,406 L188,406 Q184,300 190,244 Z" fill="#383b3a" opacity="0.85"/>

  <!-- front leg -->
  <rect x="176" y="374" width="24" height="60" rx="8" fill="#454846" stroke="#3a352f" stroke-width="4"/>
  <ellipse cx="188" cy="434" rx="15" ry="7" fill="#2b2823"/>

  <!-- rear arm, hidden mostly under cloak -->
  <rect x="234" y="288" width="20" height="70" rx="9" fill="#454846" stroke="#3a352f" stroke-width="4"/>

  <!-- front arm, lowered, clutching a stolen sack -->
  <path d="M158,272 Q118,296 108,340 Q124,318 152,300 Z"
        fill="#4f5352" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
  <!-- fist gripping the drawstring -->
  <circle cx="112" cy="344" r="13" fill="#454846" stroke="#3a352f" stroke-width="3"/>

  <!-- bulging stolen sack, tied at the neck -->
  <path d="M96,352 Q88,394 116,404 Q150,412 156,380 Q158,352 128,346 Q108,342 96,352 Z"
        fill="#5b4636" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M112,346 L128,346 L124,358 L116,358 Z" fill="#3a2a1c" stroke="#3a352f" stroke-width="3"/>
  <!-- something valuable poking out -->
  <ellipse cx="140" cy="358" rx="6" ry="10" fill="#d9a441" stroke="#3a352f" stroke-width="2" transform="rotate(20 140 358)"/>

  <!-- hood -->
  <path d="M200,150 Q160,158 156,206 Q158,238 200,246 Q242,238 244,206 Q240,158 200,150 Z"
        fill="#4f5352" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- hood shading -->
  <path d="M200,158 Q222,168 226,206 Q224,228 208,238 Q220,206 200,158 Z" fill="#383b3a" opacity="0.8"/>

  <!-- face shadow, hood conceals everything but the eyes -->
  <ellipse cx="200" cy="206" rx="34" ry="30" fill="#2b2823"/>

  <!-- eyes: pale glints in the shadow -->
  <ellipse cx="188" cy="206" rx="7" ry="5" fill="#d99a3d"/>
  <ellipse cx="212" cy="206" rx="7" ry="5" fill="#d99a3d"/>
  <circle cx="188" cy="206" r="2.2" fill="#2b2823"/>
  <circle cx="212" cy="206" r="2.2" fill="#2b2823"/>
</svg>
