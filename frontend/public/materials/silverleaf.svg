<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- a faint silvery sheen, the leaves never quite wilt -->
  <circle cx="256" cy="280" r="130" fill="#e8ecef" opacity="0.2"/>

  <!-- ground shadow beneath the plant -->
  <ellipse cx="256" cy="396" rx="100" ry="16" fill="#7c8a5a" opacity="0.5"/>

  <!-- fan of long, pointed silver leaves rising from the root -->
  <g transform="rotate(-55 256 380)">
    <path d="M256,380 Q222,280 256,150 Q290,280 256,380 Z" fill="#a8b4ac" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M256,370 Q244,290 256,190" fill="none" stroke="#eef2f0" stroke-width="4" opacity="0.8"/>
  </g>
  <g transform="rotate(-28 256 380)">
    <path d="M256,380 Q218,270 256,120 Q294,270 256,380 Z" fill="#b8c2b8" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M256,368 Q240,280 256,160" fill="none" stroke="#eef2f0" stroke-width="4" opacity="0.85"/>
  </g>
  <g>
    <path d="M256,380 Q214,260 256,100 Q298,260 256,380 Z" fill="#c4cec3" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M256,366 Q238,270 256,140" fill="none" stroke="#f4f7f5" stroke-width="4" opacity="0.9"/>
  </g>
  <g transform="rotate(28 256 380)">
    <path d="M256,380 Q218,270 256,120 Q294,270 256,380 Z" fill="#b8c2b8" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M256,368 Q240,280 256,160" fill="none" stroke="#eef2f0" stroke-width="4" opacity="0.85"/>
  </g>
  <g transform="rotate(55 256 380)">
    <path d="M256,380 Q222,280 256,150 Q290,280 256,380 Z" fill="#a8b4ac" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M256,370 Q244,290 256,190" fill="none" stroke="#eef2f0" stroke-width="4" opacity="0.8"/>
  </g>
</svg>
