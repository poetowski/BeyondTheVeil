<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- warm ember glow -->
  <circle cx="256" cy="330" r="120" fill="#ff8a3d" opacity="0.16"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="404" rx="108" ry="16" fill="#7c8a5a" opacity="0.5"/>

  <!-- smoke wisp, still drifting -->
  <path d="M240,270 Q224,236 244,206 Q260,180 246,148"
        fill="none" stroke="#c9c6c0" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

  <!-- ash mound -->
  <path d="M140,360 Q150,300 256,292 Q362,300 372,360 Q372,392 256,398 Q140,392 140,360 Z"
        fill="#8a8a82" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256,292 Q362,300 372,360 Q372,392 300,396 Q320,340 288,306 Z" fill="#5a5a52" opacity="0.7"/>

  <!-- embers still glowing within -->
  <circle cx="220" cy="336" r="14" fill="#ff8a3d" opacity="0.9"/>
  <circle cx="220" cy="336" r="6" fill="#ffcf6b"/>
  <circle cx="288" cy="352" r="10" fill="#ff8a3d" opacity="0.85"/>
  <circle cx="288" cy="352" r="4" fill="#ffcf6b"/>
  <circle cx="256" cy="320" r="7" fill="#ff8a3d" opacity="0.8"/>

  <!-- fine cracks in the crust, letting the heat show -->
  <path d="M200,320 L220,336 L212,354" fill="none" stroke="#3a352f" stroke-width="2" opacity="0.5"/>
  <path d="M300,332 L288,352 L302,366" fill="none" stroke="#3a352f" stroke-width="2" opacity="0.5"/>
</svg>
