<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- faint void-glow, swallowed almost as soon as it's cast -->
  <circle cx="256" cy="270" r="120" fill="#2a1f40" opacity="0.2"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="404" rx="106" ry="16" fill="#7c8a5a" opacity="0.5"/>

  <!-- small shard, lower left -->
  <path d="M150,340 L192,314 L214,360 L184,398 L146,382 Z"
        fill="#1c1a24" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M192,314 L214,360 L198,368 L184,332 Z" fill="#100e16" opacity="0.8"/>

  <!-- large central shard, tallest -->
  <path d="M256,190 L302,250 L288,344 L242,362 L206,300 L222,238 Z"
        fill="#1c1a24" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256,190 L302,250 L288,344 L262,330 L268,246 Z" fill="#100e16" opacity="0.85"/>

  <!-- right shard -->
  <path d="M330,300 L368,278 L384,326 L354,360 L318,344 Z"
        fill="#1c1a24" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M368,278 L384,326 L364,332 L352,296 Z" fill="#100e16" opacity="0.8"/>

  <!-- thin purple-black sheen along the edges, the only light it gives back -->
  <path d="M256,190 L302,250" stroke="#5a4a80" stroke-width="3" opacity="0.7"/>
  <path d="M206,300 L222,238" stroke="#5a4a80" stroke-width="2.5" opacity="0.6"/>
  <path d="M330,300 L368,278" stroke="#5a4a80" stroke-width="2.5" opacity="0.6"/>

  <!-- a single glint, like a reflection with nothing behind it -->
  <ellipse cx="240" cy="222" rx="7" ry="14" fill="#8a7ab0" opacity="0.6" transform="rotate(-20 240 222)"/>
</svg>
