<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- ground shadow beneath the shards -->
  <ellipse cx="256" cy="394" rx="112" ry="16" fill="#7c8a5a" opacity="0.5"/>

  <!-- large curved rim shard -->
  <path d="M170,270 Q190,206 268,196 Q340,200 366,258 L342,300 Q310,254 262,250 Q212,254 196,306 Z"
        fill="#e8e0d0" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- glaze shading -->
  <path d="M268,196 Q340,200 366,258 L342,300 Q310,254 268,250 Z" fill="#c9c0ab" opacity="0.7"/>
  <!-- faded blue pattern -->
  <path d="M198,272 Q262,224 334,268" fill="none" stroke="#5a7a9a" stroke-width="4" opacity="0.75"/>
  <circle cx="230" cy="242" r="4" fill="#5a7a9a" opacity="0.7"/>
  <circle cx="300" cy="238" r="4" fill="#5a7a9a" opacity="0.7"/>

  <!-- medium broken shard, lower left -->
  <path d="M150,330 L206,318 L228,366 L184,398 L146,378 Z"
        fill="#e8e0d0" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M206,318 L228,366 L200,378 L188,336 Z" fill="#c9c0ab" opacity="0.7"/>
  <path d="M162,344 Q188,338 210,354" fill="none" stroke="#5a7a9a" stroke-width="3" opacity="0.75"/>

  <!-- small chip, lower right -->
  <path d="M336,352 L372,344 L386,376 L358,394 L332,378 Z"
        fill="#e8e0d0" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="358" cy="366" r="4" fill="#5a7a9a" opacity="0.7"/>

  <!-- fine crack lines, showing its age -->
  <path d="M240,240 L252,270" stroke="#3a352f" stroke-width="1.5" opacity="0.4"/>
  <path d="M300,254 L296,282" stroke="#3a352f" stroke-width="1.5" opacity="0.4"/>
</svg>
