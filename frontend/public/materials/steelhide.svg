<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="256" cy="394" rx="120" ry="16" fill="#7c8a5a" opacity="0.5"/>

  <!-- hide, laid flat, rough-edged -->
  <path d="M150,260 Q140,220 176,206 Q220,190 256,204 Q296,188 336,208 Q372,224 360,266
           Q380,296 356,326 Q368,360 328,376 Q300,398 256,388 Q212,398 184,376
           Q144,360 156,326 Q132,296 150,260 Z"
        fill="#7a6a5a" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- boiled/pressed shading -->
  <path d="M256,204 Q296,188 336,208 Q372,224 360,266 Q380,296 356,326 Q368,360 328,376
           Q300,398 256,388 Z" fill="#5c4c3e" opacity="0.7"/>

  <!-- stitched seams -->
  <path d="M180,240 Q256,224 332,240" fill="none" stroke="#3a352f" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>
  <path d="M170,320 Q256,340 342,320" fill="none" stroke="#3a352f" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>

  <!-- steel-like sheen, pressed into the surface -->
  <ellipse cx="216" cy="250" rx="22" ry="9" fill="#b0b8bc" opacity="0.55" transform="rotate(-15 216 250)"/>
  <ellipse cx="300" cy="316" rx="20" ry="8" fill="#b0b8bc" opacity="0.5" transform="rotate(12 300 316)"/>
</svg>
