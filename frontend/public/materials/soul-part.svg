<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- faint, cold shimmer -->
  <circle cx="256" cy="330" r="90" fill="#dce8ea" opacity="0.25"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="398" rx="94" ry="14" fill="#7c8a5a" opacity="0.5"/>

  <!-- two smaller pieces -->
  <ellipse cx="190" cy="368" rx="22" ry="16" fill="#d8d0c0" stroke="#3a352f" stroke-width="4"/>
  <ellipse cx="186" cy="362" rx="9" ry="6" fill="#eee6d5" opacity="0.8"/>
  <ellipse cx="330" cy="374" rx="18" ry="13" fill="#c8c0b0" stroke="#3a352f" stroke-width="4"/>
  <ellipse cx="326" cy="369" rx="7" ry="5" fill="#eee6d5" opacity="0.8"/>

  <!-- main piece, smooth and plain -->
  <path d="M220,320 Q212,352 240,372 Q270,388 300,368 Q326,350 312,320
           Q302,294 272,286 Q244,290 220,320 Z"
        fill="#d8d0c0" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M272,286 Q302,294 312,320 Q326,350 300,368 Q292,340 280,318 Z" fill="#a89a82" opacity="0.6"/>

  <!-- a plain, cold gleam - nothing dramatic about it -->
  <ellipse cx="248" cy="326" rx="12" ry="7" fill="#f0ede4" opacity="0.85" transform="rotate(-20 248 326)"/>
</svg>
