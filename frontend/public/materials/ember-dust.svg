<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>

  <!-- near grass tufts -->
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- faint smoke wisp, still hot -->
  <path d="M256,150 Q272,120 254,96 Q238,74 258,48"
        fill="none" stroke="#c9c9c0" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

  <!-- warm glow beneath the ash -->
  <ellipse cx="256" cy="382" rx="128" ry="24" fill="#d98a2c" opacity="0.2"/>
  <!-- ground shadow -->
  <ellipse cx="256" cy="394" rx="120" ry="16" fill="#7c8a5a" opacity="0.5"/>

  <!-- ash mound, soft powdery pile -->
  <path d="M140,378 Q150,300 220,282 Q246,266 274,282 Q346,296 366,368
           Q372,396 340,404 L166,404 Q134,398 140,378 Z"
        fill="#9a988e" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- shading -->
  <path d="M220,282 Q246,266 274,282 Q300,292 316,320 L200,320 Q206,296 220,282 Z"
        fill="#b3b1a6" opacity="0.85"/>
  <path d="M166,404 Q160,370 190,352 L340,352 Q360,372 340,404 Z"
        fill="#7c7a70" opacity="0.6"/>

  <!-- powder puffs drifting off the pile -->
  <circle cx="128" cy="360" r="10" fill="#9a988e" opacity="0.7"/>
  <circle cx="112" cy="344" r="6" fill="#9a988e" opacity="0.5"/>
  <circle cx="384" cy="356" r="9" fill="#9a988e" opacity="0.7"/>
  <circle cx="400" cy="340" r="5" fill="#9a988e" opacity="0.5"/>

  <!-- glowing embers still faintly hot within the ash -->
  <g>
    <circle cx="220" cy="330" r="12" fill="#e8622c" opacity="0.35"/>
    <circle cx="220" cy="330" r="5" fill="#ff8a3d"/>
    <circle cx="292" cy="316" r="14" fill="#e8622c" opacity="0.35"/>
    <circle cx="292" cy="316" r="6" fill="#ff8a3d"/>
    <circle cx="256" cy="366" r="10" fill="#e8622c" opacity="0.3"/>
    <circle cx="256" cy="366" r="4" fill="#ffab5e"/>
  </g>
</svg>
