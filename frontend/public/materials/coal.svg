<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>

  <!-- near grass tufts -->
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- ground shadow, spanning the pile's lopsided footprint -->
  <ellipse cx="252" cy="412" rx="142" ry="16" fill="#7c8a5a" opacity="0.5"/>

  <!-- dominant lump, large and weighted to the left -->
  <polygon points="120,340 160,290 224,282 260,320 250,370 200,404 140,396 108,368"
           fill="#221f1c" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="160,290 224,282 210,320 168,326" fill="#38332c" opacity="0.85"/>

  <!-- medium lump, set back and higher to the right - not mirrored -->
  <polygon points="270,290 316,266 360,286 366,326 330,344 288,330"
           fill="#2a2622" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="316,266 360,286 344,304 300,298" fill="#403a31" opacity="0.85"/>

  <!-- small lump, tucked below the medium one, no mirrored counterpart -->
  <polygon points="316,362 344,346 372,362 366,392 334,398"
           fill="#25211d" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="344,346 372,362 358,376 328,368" fill="#3a352e" opacity="0.85"/>

  <!-- faint bluish sheen, coal's characteristic luster - uneven placement -->
  <g fill="#6b7480" opacity="0.55">
    <ellipse cx="150" cy="320" rx="9" ry="4" transform="rotate(-20 150 320)"/>
    <ellipse cx="200" cy="360" rx="7" ry="3" transform="rotate(10 200 360)"/>
    <ellipse cx="330" cy="292" rx="8" ry="3.5" transform="rotate(-10 330 292)"/>
  </g>

  <!-- loose bits trailing off to the right, uneven sizes -->
  <polygon points="380,380 398,370 410,388 396,402 378,398"
           fill="#221f1c" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="410,396 422,390 430,402 420,412"
           fill="#2a2622" stroke="#3a352f" stroke-width="3" stroke-linejoin="round"/>
</svg>
