<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>

  <!-- scattered wildflowers -->
  <g>
    <circle cx="60" cy="360" r="5" fill="#f3ecff"/>
    <circle cx="60" cy="360" r="2" fill="#e8b23d"/>
    <circle cx="452" cy="375" r="5" fill="#f3ecff"/>
    <circle cx="452" cy="375" r="2" fill="#e8b23d"/>
  </g>

  <!-- near grass tufts -->
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- ground shadow beneath the plant -->
  <ellipse cx="256" cy="396" rx="115" ry="16" fill="#7c8a5a" opacity="0.5"/>

  <!-- stems -->
  <path d="M190,392 Q178,300 172,214" fill="none" stroke="#5a7a4a" stroke-width="7" stroke-linecap="round"/>
  <path d="M322,392 Q334,300 344,228" fill="none" stroke="#5a7a4a" stroke-width="7" stroke-linecap="round"/>
  <path d="M256,392 Q252,270 256,152" fill="none" stroke="#5a7a4a" stroke-width="8" stroke-linecap="round"/>

  <!-- thin feathery leaves -->
  <g fill="#5a7a4a" stroke="#3a352f" stroke-width="2">
    <ellipse cx="196" cy="330" rx="24" ry="7" transform="rotate(-25 196 330)"/>
    <ellipse cx="168" cy="280" rx="22" ry="6" transform="rotate(20 168 280)"/>
    <ellipse cx="330" cy="335" rx="24" ry="7" transform="rotate(25 330 335)"/>
    <ellipse cx="348" cy="285" rx="20" ry="6" transform="rotate(-15 348 285)"/>
    <ellipse cx="240" cy="300" rx="26" ry="7" transform="rotate(-20 240 300)"/>
    <ellipse cx="272" cy="240" rx="24" ry="7" transform="rotate(18 272 240)"/>
  </g>

  <!-- left flower (small) -->
  <g>
    <g fill="#f7f5ea" stroke="#3a352f" stroke-width="3">
      <g transform="rotate(0 170 210)"><ellipse cx="170" cy="184" rx="9" ry="26"/></g>
      <g transform="rotate(45 170 210)"><ellipse cx="170" cy="184" rx="9" ry="26"/></g>
      <g transform="rotate(90 170 210)"><ellipse cx="170" cy="184" rx="9" ry="26"/></g>
      <g transform="rotate(135 170 210)"><ellipse cx="170" cy="184" rx="9" ry="26"/></g>
      <g transform="rotate(180 170 210)"><ellipse cx="170" cy="184" rx="9" ry="26"/></g>
      <g transform="rotate(225 170 210)"><ellipse cx="170" cy="184" rx="9" ry="26"/></g>
      <g transform="rotate(270 170 210)"><ellipse cx="170" cy="184" rx="9" ry="26"/></g>
      <g transform="rotate(315 170 210)"><ellipse cx="170" cy="184" rx="9" ry="26"/></g>
    </g>
    <circle cx="170" cy="210" r="15" fill="#e8b23d" stroke="#3a352f" stroke-width="3"/>
  </g>

  <!-- right flower (small) -->
  <g>
    <g fill="#f7f5ea" stroke="#3a352f" stroke-width="3">
      <g transform="rotate(0 345 224)"><ellipse cx="345" cy="198" rx="9" ry="26"/></g>
      <g transform="rotate(45 345 224)"><ellipse cx="345" cy="198" rx="9" ry="26"/></g>
      <g transform="rotate(90 345 224)"><ellipse cx="345" cy="198" rx="9" ry="26"/></g>
      <g transform="rotate(135 345 224)"><ellipse cx="345" cy="198" rx="9" ry="26"/></g>
      <g transform="rotate(180 345 224)"><ellipse cx="345" cy="198" rx="9" ry="26"/></g>
      <g transform="rotate(225 345 224)"><ellipse cx="345" cy="198" rx="9" ry="26"/></g>
      <g transform="rotate(270 345 224)"><ellipse cx="345" cy="198" rx="9" ry="26"/></g>
      <g transform="rotate(315 345 224)"><ellipse cx="345" cy="198" rx="9" ry="26"/></g>
    </g>
    <circle cx="345" cy="224" r="15" fill="#e8b23d" stroke="#3a352f" stroke-width="3"/>
  </g>

  <!-- center flower (main, larger) -->
  <g>
    <g fill="#f7f5ea" stroke="#3a352f" stroke-width="3">
      <g transform="rotate(0 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(30 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(60 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(90 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(120 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(150 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(180 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(210 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(240 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(270 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(300 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
      <g transform="rotate(330 256 152)"><ellipse cx="256" cy="118" rx="12" ry="34"/></g>
    </g>
    <circle cx="256" cy="152" r="22" fill="#e8b23d" stroke="#3a352f" stroke-width="4"/>
    <circle cx="250" cy="146" r="7" fill="#f3d38a" opacity="0.8"/>
  </g>
</svg>
