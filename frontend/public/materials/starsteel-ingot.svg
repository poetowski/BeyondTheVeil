<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2df"/>
      <stop offset="100%" stop-color="#dce6c8"/>
    </linearGradient>
  </defs>

  <!-- meadow sky -->
  <rect x="0" y="0" width="512" height="340" fill="url(#sky)"/>
  <!-- meadow ground -->
  <rect x="0" y="340" width="512" height="172" fill="#93a06e"/>

  <!-- distant grass tufts -->
  <g fill="#7c8f61">
    <polygon points="50,345 40,320 60,320"/>
    <polygon points="90,345 80,325 100,325"/>
    <polygon points="420,345 410,322 430,322"/>
    <polygon points="460,345 450,326 470,326"/>
  </g>
  <g fill="#4f6b47">
    <polygon points="20,390 6,350 34,350"/>
    <polygon points="492,388 478,346 506,346"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="256" cy="400" rx="108" ry="16" fill="#7c8a5a" opacity="0.5"/>

  <!-- second, smaller ingot behind -->
  <polygon points="300,300 380,296 392,336 316,344"
           fill="#2e3742" stroke="#3a352f" stroke-width="4" stroke-linejoin="round"/>

  <!-- main ingot, chunky and angular -->
  <polygon points="150,270 340,260 372,320 358,368 168,384 130,326"
           fill="#3a4550" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="150,270 340,260 372,320 260,332 168,300 130,326" fill="#6b7f94" opacity="0.85"/>

  <!-- pitted, meteoric surface -->
  <g fill="#2e3742">
    <circle cx="210" cy="310" r="7"/>
    <circle cx="270" cy="300" r="5"/>
    <circle cx="300" cy="340" r="6"/>
    <circle cx="200" cy="350" r="5"/>
  </g>

  <!-- starlight flecks caught in the metal -->
  <g fill="#cfe0f0">
    <path d="M240,286 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 Z" opacity="0.9"/>
    <path d="M310,286 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 l6,-2 Z" opacity="0.85"/>
    <circle cx="190" cy="292" r="3" opacity="0.85"/>
  </g>

  <!-- sheen highlight -->
  <ellipse cx="200" cy="284" rx="26" ry="8" fill="#d4dee6" opacity="0.7" transform="rotate(-8 200 284)"/>
</svg>
