<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="410" rx="70" ry="16" fill="#3a352f" opacity="0.2"/>

  <!-- bottle -->
  <path d="M222,180 L222,140 L290,140 L290,180
           Q334,220 334,300 Q334,392 256,392 Q178,392 178,300
           Q178,220 222,180 Z"
        fill="#eaffff" opacity="0.35" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>

  <!-- liquid -->
  <path d="M188,300 Q188,384 256,384 Q324,384 324,300 Q324,260 300,230
           L212,230 Q188,260 188,300 Z"
        fill="#7fa663"/>
  <path d="M212,230 L300,230 Q312,244 318,262 L198,262 Q204,244 212,230 Z" fill="#9cc47f" opacity="0.7"/>

  <!-- bottle neck highlight -->
  <rect x="228" y="146" width="12" height="30" fill="#ffffff" opacity="0.5"/>

  <!-- cork -->
  <rect x="216" y="118" width="80" height="30" rx="6" fill="#8a6a45" stroke="#3a352f" stroke-width="4"/>
  <rect x="222" y="112" width="68" height="16" rx="5" fill="#5b4636" stroke="#3a352f" stroke-width="3"/>
</svg>
