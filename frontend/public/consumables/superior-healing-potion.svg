<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- a faint shimmer, the strongest brew there is -->
  <circle cx="256" cy="300" r="150" fill="#e8ecef" opacity="0.15"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="426" rx="90" ry="18" fill="#3a352f" opacity="0.22"/>

  <!-- fat, rounded bottle -->
  <path d="M216,172 L216,136 L296,136 L296,172
           Q354,204 354,300 Q354,412 256,412 Q158,412 158,300
           Q158,204 216,172 Z"
        fill="#eaffff" opacity="0.35" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>

  <!-- bright, mercury-silver liquid, filled high -->
  <path d="M172,296 Q172,404 256,404 Q340,404 340,296 Q340,248 312,214
           L200,214 Q172,248 172,296 Z"
        fill="#aeb8bd"/>
  <path d="M200,214 L312,214 Q326,230 334,250 L178,250 Q186,230 200,214 Z" fill="#d6dade" opacity="0.85"/>
  <!-- shimmering highlight streak, mercury-bright -->
  <path d="M210,240 Q206,320 226,390" fill="none" stroke="#f4f6f5" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <!-- a deeper pool shadow near the bottom -->
  <ellipse cx="256" cy="372" rx="66" ry="24" fill="#7c8890" opacity="0.5"/>

  <!-- bottle neck highlight -->
  <rect x="224" y="140" width="14" height="28" fill="#ffffff" opacity="0.5"/>

  <!-- cork with a gold wax seal, marking it the premium tier -->
  <rect x="210" y="110" width="92" height="32" rx="7" fill="#8a6a45" stroke="#3a352f" stroke-width="4"/>
  <rect x="216" y="102" width="80" height="18" rx="6" fill="#5b4636" stroke="#3a352f" stroke-width="3"/>
  <circle cx="256" cy="126" r="12" fill="#d9a441" stroke="#3a352f" stroke-width="3"/>
</svg>
