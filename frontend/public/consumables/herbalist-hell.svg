<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- a sickly green haze behind the bottle -->
  <circle cx="256" cy="290" r="140" fill="#6b8a2e" opacity="0.16"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="410" rx="70" ry="16" fill="#3a352f" opacity="0.22"/>

  <!-- bottle -->
  <path d="M222,180 L222,140 L290,140 L290,180
           Q334,220 334,300 Q334,392 256,392 Q178,392 178,300
           Q178,220 222,180 Z"
        fill="#eaffff" opacity="0.35" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>

  <!-- murky, overdosed brew -->
  <path d="M188,300 Q188,384 256,384 Q324,384 324,300 Q324,260 300,230
           L212,230 Q188,260 188,300 Z"
        fill="#2e3a1a"/>
  <path d="M212,230 L300,230 Q312,244 318,262 L198,262 Q204,244 212,230 Z" fill="#465c22" opacity="0.8"/>
  <!-- fizzing bubbles -->
  <circle cx="232" cy="290" r="7" fill="#7fa63f" opacity="0.7"/>
  <circle cx="278" cy="320" r="9" fill="#7fa63f" opacity="0.6"/>
  <circle cx="252" cy="350" r="5" fill="#9cc966" opacity="0.7"/>
  <circle cx="290" cy="280" r="4" fill="#9cc966" opacity="0.6"/>
  <!-- green fumes escaping the neck -->
  <path d="M238,224 Q230,196 244,168" fill="none" stroke="#7fa63f" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <path d="M270,224 Q280,198 266,170" fill="none" stroke="#7fa63f" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- bottle neck highlight -->
  <rect x="228" y="146" width="12" height="30" fill="#ffffff" opacity="0.5"/>

  <!-- cork -->
  <rect x="216" y="118" width="80" height="30" rx="6" fill="#8a6a45" stroke="#3a352f" stroke-width="4"/>
  <rect x="222" y="112" width="68" height="16" rx="5" fill="#5b4636" stroke="#3a352f" stroke-width="3"/>

  <!-- a single bright flower, blooming out of the cork - what's waiting on the other side of the overdose -->
  <line x1="256" y1="112" x2="256" y2="90" stroke="#4a7a3a" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="246" cy="76" r="8" fill="#e87ba4"/>
    <circle cx="266" cy="76" r="8" fill="#e87ba4"/>
    <circle cx="256" cy="66" r="8" fill="#e87ba4"/>
    <circle cx="256" cy="86" r="8" fill="#e87ba4"/>
    <circle cx="256" cy="76" r="6" fill="#eda100"/>
  </g>
</svg>
