<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="366" rx="100" ry="18" fill="#3a352f" opacity="0.2"/>

  <!-- stone tablet -->
  <path d="M176,150 L336,150 Q360,150 360,174 L360,338 Q360,362 336,362
           L176,362 Q152,362 152,338 L152,174 Q152,150 176,150 Z"
        fill="#8f8f8f" stroke="#3a352f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M176,150 L336,150 Q360,150 360,174 L360,200 L152,200 L152,174 Q152,150 176,150 Z"
        fill="#a5a5a5" opacity="0.6"/>
  <!-- worn chip corner -->
  <path d="M336,362 L360,362 L360,342 Z" fill="#6f6f6f" opacity="0.7"/>

  <!-- glow behind glyph, matching Veil Crystal's violet -->
  <circle cx="256" cy="256" r="86" fill="#8a4fc9" opacity="0.25"/>

  <!-- cunning glyph: a coiled spiral that hides a second, smaller spiral
       at its center - a mark that rewards a closer look -->
  <path d="M256,256 m0,-58
           a58,58 0 1 1 -41,99
           a40,40 0 1 1 29,-68
           a22,22 0 1 1 -16,38"
        fill="none" stroke="#8a4fc9" stroke-width="10" stroke-linecap="round"/>
  <!-- hidden inner spiral -->
  <path d="M256,256 m0,-14 a14,14 0 1 1 -10,24" fill="none" stroke="#4a2270" stroke-width="4" stroke-linecap="round"/>
  <!-- core node -->
  <circle cx="256" cy="256" r="8" fill="#d8b8ff" stroke="#4a2270" stroke-width="3"/>
  <!-- shine highlight -->
  <ellipse cx="230" cy="212" rx="9" ry="5" fill="#d8b8ff" opacity="0.85" transform="rotate(-30 230 212)"/>
</svg>
