<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="366" rx="100" ry="18" fill="#3a352f" opacity="0.2"/>

  <!-- stone tablet -->
  <path d="M176,150 L336,150 Q360,150 360,174 L360,338 Q360,362 336,362
           L176,362 Q152,362 152,338 L152,174 Q152,150 176,150 Z"
        fill="#8f8f8f" stroke="#3a352f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M176,150 L336,150 Q360,150 360,174 L360,200 L152,200 L152,174 Q152,150 176,150 Z"
        fill="#a5a5a5" opacity="0.6"/>
  <!-- worn chip corner -->
  <path d="M336,150 L360,150 L360,170 Z" fill="#6f6f6f" opacity="0.7"/>

  <!-- glow behind glyph, warm porcelain gold - unlike the single-hue glows
       of every other rune, marking this one as different -->
  <circle cx="256" cy="256" r="86" fill="#d9a441" opacity="0.2"/>

  <!-- wholeness glyph: a six-sided hexagon, one point for each stat,
       fired in old porcelain -->
  <polygon points="256,196 308,226 308,286 256,316 204,286 204,226"
           fill="#e8e0d0" stroke="#3a352f" stroke-width="6" stroke-linejoin="round"/>
  <!-- crackle-glaze pattern, echoing Ancient Porcelain -->
  <path d="M256,196 L256,316 M204,226 L308,286 M308,226 L204,286"
        fill="none" stroke="#5a7a9a" stroke-width="3" opacity="0.65"/>
  <!-- six stat nodes, one at each vertex -->
  <g fill="#d9a441" stroke="#3a352f" stroke-width="2.5">
    <circle cx="256" cy="196" r="7"/>
    <circle cx="308" cy="226" r="7"/>
    <circle cx="308" cy="286" r="7"/>
    <circle cx="256" cy="316" r="7"/>
    <circle cx="204" cy="286" r="7"/>
    <circle cx="204" cy="226" r="7"/>
  </g>
  <!-- core -->
  <circle cx="256" cy="256" r="10" fill="#f4ede0" stroke="#3a352f" stroke-width="3"/>

  <!-- shine highlight -->
  <ellipse cx="232" cy="222" rx="9" ry="5" fill="#faf5ea" opacity="0.85" transform="rotate(-30 232 222)"/>
</svg>
