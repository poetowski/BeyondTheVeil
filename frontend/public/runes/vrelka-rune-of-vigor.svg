<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="366" rx="100" ry="18" fill="#3a352f" opacity="0.2"/>

  <!-- stone tablet -->
  <path d="M176,150 L336,150 Q360,150 360,174 L360,338 Q360,362 336,362
           L176,362 Q152,362 152,338 L152,174 Q152,150 176,150 Z"
        fill="#8f8f8f" stroke="#3a352f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M176,150 L336,150 Q360,150 360,174 L360,200 L152,200 L152,174 Q152,150 176,150 Z"
        fill="#a5a5a5" opacity="0.6"/>
  <!-- worn chip corner -->
  <path d="M152,338 L152,320 L172,338 Z" fill="#6f6f6f" opacity="0.7"/>

  <!-- glow behind glyph -->
  <circle cx="256" cy="256" r="86" fill="#e0453f" opacity="0.25"/>

  <!-- vigor glyph: a rising, rounded rune (life/growth motif) -->
  <path d="M256,190 Q286,220 286,262 Q286,300 256,300 Q226,300 226,262 Q226,220 256,190 Z"
        fill="#e0453f" stroke="#7a1f1c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256,300 L256,330" stroke="#e0453f" stroke-width="10" stroke-linecap="round"/>
  <path d="M226,318 L286,318" stroke="#e0453f" stroke-width="10" stroke-linecap="round"/>
  <!-- glyph highlight -->
  <ellipse cx="242" cy="230" rx="10" ry="16" fill="#ff8b83" opacity="0.7" transform="rotate(-20 242 230)"/>
</svg>
