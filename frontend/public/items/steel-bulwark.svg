<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="446" rx="96" ry="18" fill="#3a352f" opacity="0.2"/>

  <!-- broad, heavy shield body -->
  <path d="M256,84 L370,132 Q376,232 344,326 Q312,416 256,456 Q200,416 168,326 Q136,232 142,132 Z"
        fill="#7a8590" stroke="#3a352f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256,84 L370,132 Q376,232 344,326 Q324,384 292,424 Q302,320 290,196 Q282,124 256,84 Z"
        fill="#57626c" opacity="0.75"/>

  <!-- thick reinforced rim -->
  <path d="M256,84 L370,132 Q376,232 344,326 Q312,416 256,456 Q200,416 168,326 Q136,232 142,132 Z"
        fill="none" stroke="#4a5560" stroke-width="8"/>

  <!-- heavy rivets -->
  <g fill="#57626c" stroke="#3a352f" stroke-width="2.5">
    <circle cx="196" cy="188" r="8"/>
    <circle cx="316" cy="188" r="8"/>
    <circle cx="210" cy="330" r="8"/>
    <circle cx="302" cy="330" r="8"/>
    <circle cx="256" cy="404" r="8"/>
  </g>

  <!-- central boss -->
  <circle cx="256" cy="248" r="40" fill="#8c96a0" stroke="#3a352f" stroke-width="5"/>
  <circle cx="256" cy="248" r="16" fill="#57626c"/>
  <ellipse cx="242" cy="234" rx="12" ry="7" fill="#d4dee6" opacity="0.85" transform="rotate(-30 242 234)"/>
</svg>
