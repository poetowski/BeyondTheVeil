<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="420" rx="140" ry="20" fill="#3a352f" opacity="0.2"/>

  <!-- solid breastplate, one heavy piece -->
  <path d="M180,140 L332,140 L360,260 L392,410 L120,410 L152,260 Z"
        fill="#7a8590" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256,140 L332,140 L360,260 L378,410 L256,410 Z" fill="#57626c" opacity="0.7"/>

  <!-- raised center ridge -->
  <path d="M256,150 L256,400" stroke="#4a5560" stroke-width="10"/>
  <path d="M256,150 L256,400" stroke="#d4dee6" stroke-width="3" opacity="0.6"/>

  <!-- heavy rivets along the seams -->
  <g fill="#57626c" stroke="#3a352f" stroke-width="2.5">
    <circle cx="196" cy="176" r="6"/>
    <circle cx="316" cy="176" r="6"/>
    <circle cx="176" cy="260" r="6"/>
    <circle cx="336" cy="260" r="6"/>
    <circle cx="160" cy="360" r="6"/>
    <circle cx="352" cy="360" r="6"/>
  </g>

  <!-- collar -->
  <path d="M210,140 Q256,166 302,140 L292,156 Q256,178 220,156 Z" fill="#4a5560" stroke="#3a352f" stroke-width="3"/>
  <!-- belt -->
  <rect x="140" y="270" width="232" height="16" fill="#4a5560" stroke="#3a352f" stroke-width="3"/>
  <rect x="240" y="268" width="32" height="20" fill="#57626c" stroke="#3a352f" stroke-width="2"/>
</svg>
