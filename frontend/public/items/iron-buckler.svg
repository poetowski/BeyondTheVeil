<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow, smaller than Iron Buckler's bigger cousin - this is a small round shield -->
  <ellipse cx="256" cy="378" rx="100" ry="18" fill="#3a352f" opacity="0.2"/>

  <!-- buckler body -->
  <circle cx="256" cy="256" r="112" fill="#8a939c" stroke="#3a352f" stroke-width="6"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#5f6870" stroke-width="10" opacity="0.5"/>

  <!-- rivets ringing the rim -->
  <g fill="#5f6870" stroke="#3a352f" stroke-width="2">
    <circle cx="256" cy="158" r="7"/>
    <circle cx="256" cy="354" r="7"/>
    <circle cx="158" cy="256" r="7"/>
    <circle cx="354" cy="256" r="7"/>
    <circle cx="186" cy="186" r="7"/>
    <circle cx="326" cy="186" r="7"/>
    <circle cx="186" cy="326" r="7"/>
    <circle cx="326" cy="326" r="7"/>
  </g>

  <!-- prominent central boss, a buckler's signature feature -->
  <circle cx="256" cy="256" r="42" fill="#7c8890" stroke="#3a352f" stroke-width="5"/>
  <circle cx="256" cy="256" r="15" fill="#5f6870"/>
  <ellipse cx="242" cy="242" rx="12" ry="7" fill="#c9d1d8" opacity="0.8" transform="rotate(-30 242 242)"/>
</svg>
