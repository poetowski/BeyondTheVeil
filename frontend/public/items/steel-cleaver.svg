<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="380" rx="150" ry="26" fill="#3a352f" opacity="0.2"/>

  <g transform="rotate(-24 256 256)">
    <!-- wide, heavy cleaver blade -->
    <polygon points="206,220 392,228 392,286 206,292"
             fill="#7a8590" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="206,220 392,228 392,250 206,246" fill="#57626c" opacity="0.75"/>
    <line x1="216" y1="256" x2="380" y2="258" stroke="#d4dee6" stroke-width="4" opacity="0.7"/>
    <!-- thick spine -->
    <rect x="200" y="238" width="16" height="40" rx="3" fill="#57626c" stroke="#3a352f" stroke-width="4"/>
    <!-- wrapped grip -->
    <rect x="140" y="246" width="60" height="22" rx="6" fill="#5b4636" stroke="#3a352f" stroke-width="4"/>
    <line x1="152" y1="246" x2="152" y2="268" stroke="#3a352f" stroke-width="2" opacity="0.6"/>
    <line x1="166" y1="246" x2="166" y2="268" stroke="#3a352f" stroke-width="2" opacity="0.6"/>
    <line x1="180" y1="246" x2="180" y2="268" stroke="#3a352f" stroke-width="2" opacity="0.6"/>
    <!-- flat pommel -->
    <rect x="128" y="244" width="12" height="26" rx="3" fill="#57626c" stroke="#3a352f" stroke-width="3"/>
  </g>
</svg>
