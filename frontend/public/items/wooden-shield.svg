<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="400" rx="130" ry="20" fill="#3a352f" opacity="0.2"/>

  <!-- shield body -->
  <circle cx="256" cy="256" r="150" fill="#8a6a45" stroke="#3a352f" stroke-width="6"/>
  <!-- plank lines across the shield -->
  <line x1="106" y1="196" x2="406" y2="196" stroke="#5b4636" stroke-width="6"/>
  <line x1="106" y1="256" x2="406" y2="256" stroke="#5b4636" stroke-width="6"/>
  <line x1="106" y1="316" x2="406" y2="316" stroke="#5b4636" stroke-width="6"/>
  <!-- hide rim -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#5b4636" stroke-width="10" opacity="0.5"/>
  <!-- boss -->
  <circle cx="256" cy="256" r="34" fill="#8a7a52" stroke="#3a352f" stroke-width="5"/>
  <circle cx="246" cy="246" r="10" fill="#cf9f6c" opacity="0.7"/>
</svg>
