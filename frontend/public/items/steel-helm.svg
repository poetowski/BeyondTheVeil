<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="392" rx="105" ry="20" fill="#3a352f" opacity="0.2"/>

  <!-- closed dome, heavier and plainer than the Barbute -->
  <path d="M148,304 Q136,150 256,130 Q376,150 364,304 Q364,364 256,372 Q148,364 148,304 Z"
        fill="#7a8590" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256,130 Q334,150 344,284 L256,304 Z" fill="#57626c" opacity="0.8"/>

  <!-- simple visor slit -->
  <rect x="196" y="222" width="120" height="24" rx="6" fill="#2b2823"/>
  <ellipse cx="230" cy="234" rx="5" ry="4" fill="#d99a3d" opacity="0.85"/>
  <ellipse cx="282" cy="234" rx="5" ry="4" fill="#d99a3d" opacity="0.85"/>

  <!-- a dent, from something that didn't get through -->
  <path d="M310,180 Q322,190 314,204 Q302,196 300,184 Z" fill="#57626c" opacity="0.8"/>

  <!-- heavy rivets -->
  <g fill="#57626c" stroke="#3a352f" stroke-width="2.5">
    <circle cx="172" cy="270" r="7"/>
    <circle cx="340" cy="270" r="7"/>
    <circle cx="256" cy="358" r="7"/>
  </g>
</svg>
