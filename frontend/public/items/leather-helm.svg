<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="380" rx="110" ry="20" fill="#3a352f" opacity="0.2"/>

  <!-- helm dome -->
  <path d="M146,330 Q140,180 256,150 Q372,180 366,330 Z" fill="#7a5a3a" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
  <!-- shading patch -->
  <path d="M256,150 Q310,170 322,280 L256,300 Z" fill="#5f4630" opacity="0.8"/>
  <!-- brim -->
  <ellipse cx="256" cy="330" rx="120" ry="24" fill="#8a6a45" stroke="#3a352f" stroke-width="5"/>
  <!-- stitching seam -->
  <path d="M256,155 Q252,240 256,296" fill="none" stroke="#3a352f" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
  <!-- strap -->
  <path d="M186,300 Q186,340 200,360" fill="none" stroke="#5b4636" stroke-width="8" stroke-linecap="round"/>
</svg>
