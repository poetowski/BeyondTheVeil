<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- wooden table -->
  <rect x="0" y="0" width="512" height="512" fill="#b98956"/>
  <rect x="0" y="120" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="260" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="0" y="400" width="512" height="6" fill="#a3703f" opacity="0.6"/>
  <rect x="40" y="40" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="300" y="180" width="150" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="80" y="320" width="200" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>
  <rect x="250" y="440" width="180" height="4" rx="2" fill="#cf9f6c" opacity="0.5"/>

  <!-- contact shadow -->
  <ellipse cx="256" cy="380" rx="150" ry="26" fill="#3a352f" opacity="0.2"/>

  <!-- the sword -->
  <g transform="rotate(-32 256 256)">
    <!-- blade, tapering to a point -->
    <polygon points="220,238 340,238 388,256 340,274 220,274"
             fill="#8a939c" stroke="#3a352f" stroke-width="5" stroke-linejoin="round"/>
    <line x1="228" y1="256" x2="376" y2="256" stroke="#c9d1d8" stroke-width="4" opacity="0.7"/>
    <!-- crossguard -->
    <rect x="204" y="224" width="18" height="64" rx="5" fill="#5f6870" stroke="#3a352f" stroke-width="4"/>
    <!-- leather-wrapped grip -->
    <rect x="150" y="246" width="56" height="20" rx="8" fill="#5b4636" stroke="#3a352f" stroke-width="4"/>
    <!-- pommel -->
    <circle cx="150" cy="256" r="15" fill="#8a939c" stroke="#3a352f" stroke-width="4"/>
  </g>
</svg>
