# Render Blueprint for Beyond the Veil - one web service, serving both
# the API and the built frontend, backed by an external Neon database.
#
# This is a starting point, not a guarantee - verify field names/behavior
# against Render's current Blueprint docs (render.com/docs/blueprint-spec)
# before relying on it, since the schema does evolve. Fields marked
# `sync: false` must be set manually in the Render dashboard (never commit
# real secrets or a real database URL here).
#
# Database: deploying to Neon, not Render's own Postgres, so there is no
# `databases:` section here - create the Neon project/branch yourself and
# paste its connection string (with `?sslmode=require`) into DATABASE_URL
# below.
#
# Single-service layout: the build step compiles the frontend first, then
# installs the backend; at runtime, app/main.py serves the built frontend
# assets directly (falling back to index.html for client-side routes) so
# one process/one URL handles everything. FRONTEND_ORIGIN/CORS isn't
# needed here since the frontend and API now share an origin - it's still
# used for local dev, where they run as two separate dev servers.

services:
  - type: web
    name: beyondtheveil
    env: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -e ."
    # Migrations and reference-data seeding run on every start, not just
    # first deploy - both are idempotent (a no-op once already applied/
    # present), so this is safe on restarts and simpler than relying on a
    # separate pre-deploy hook.
    startCommand: "cd backend && alembic upgrade head && python -m scripts.seed_dev_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string (with ?sslmode=require) here
      - key: JWT_SECRET_KEY
        generateValue: true # Render generates and stores a random secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: APP_ENV
        value: "prod" # selects the slow/real gameplay-pacing preset (see backend/app/core/config.py); "test" is for manual testing only
      - key: VITE_API_BASE_URL
        value: "" # empty = same-origin relative requests, since it's all one service
