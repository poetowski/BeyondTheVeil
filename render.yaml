# Render Blueprint for Beyond the Veil.
#
# This is a starting point, not a guarantee - verify field names/behavior
# against Render's current Blueprint docs (render.com/docs/blueprint-spec)
# before relying on it, since the schema does evolve. Fields marked
# `sync: false` must be set manually in the Render dashboard (never commit
# real secrets or a real database URL here).
#
# Database: this repo is deploying to Neon, not Render's own Postgres, so
# there is no `databases:` section here - create the Neon project/branch
# yourself and paste its connection string (with `?sslmode=require`) into
# the backend service's DATABASE_URL below.

services:
  - type: web
    name: beyondtheveil-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -e ."
    # Migrations run on every start, not just first deploy - alembic
    # upgrades are idempotent (a no-op once already applied), so this is
    # safe on restarts and simpler than relying on a separate pre-deploy
    # hook.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string (with ?sslmode=require) here
      - key: JWT_SECRET_KEY
        generateValue: true # Render generates and stores a random secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: VEIL_DURATION_SECONDS
        value: "300"
      - key: FRONTEND_ORIGIN
        sync: false # set to the frontend service's URL once it's deployed

  - type: web
    name: beyondtheveil-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to the backend service's URL once it's deployed
